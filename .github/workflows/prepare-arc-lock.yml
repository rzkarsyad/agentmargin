name: Arc UI lockfile bootstrap (temporary)

on:
  push:
    branches: [feat/v0.3-workspace-pricing]
    paths:
      - apps/web/package.json
      - package.json
      - .github/workflows/prepare-arc-lock.yml

permissions:
  contents: write

jobs:
  generate-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate consistent lockfile for the Arc React workspace
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile only to feature branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(web): lock React 19 and Arc frontend dependencies"
          git push origin HEAD:feat/v0.3-workspace-pricing
