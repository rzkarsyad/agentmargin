name: Publish SDK (manual, OIDC)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Approved sdk-vX.Y.Z-alpha.N tag on the exact protected main commit'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main' && github.repository == 'rzkarsyad/agentmargin'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read
    outputs:
      sdk_sha256: ${{ steps.pack.outputs.sdk_sha256 }}
    steps:
      - name: Validate release tag format
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^sdk-v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
          fetch-depth: 0
      - name: Require exact protected main source and final-commit CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          release_commit=$(git rev-parse HEAD)
          test "$release_commit" = "$GITHUB_SHA"
          test "$release_commit" = "$(git rev-parse origin/main)"
          gh api "repos/$GITHUB_REPOSITORY/commits/$release_commit/check-runs" \
            --jq '.check_runs | map(select(.name == "test" and .app.id == 15368)) | sort_by(.id) | last | .status == "completed" and .conclusion == "success"' > "$RUNNER_TEMP/release-check.txt"
          test "$(cat "$RUNNER_TEMP/release-check.txt")" = true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Ensure tag and package match
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node --input-type=module -e '
          import fs from "node:fs";
          const v=JSON.parse(fs.readFileSync("packages/sdk/package.json")).version;
          if(process.env.RELEASE_TAG!==`sdk-v${v}`) process.exit(1);
          '
      - name: Prepare SDK and pinned publishing CLI without OIDC authority
        id: pack
        run: |
          mkdir "$RUNNER_TEMP/sdk-publish"
          npm pack --workspace @makinohq/agentmargin --ignore-scripts --json --pack-destination "$RUNNER_TEMP/sdk-publish" > "$RUNNER_TEMP/sdk-pack.json"
          sdk_file=$(node -p 'JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP+"/sdk-pack.json"))[0].filename')
          [[ "$sdk_file" =~ ^makinohq-agentmargin-[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+\.tgz$ ]]
          mv "$RUNNER_TEMP/sdk-publish/$sdk_file" "$RUNNER_TEMP/sdk-publish/agentmargin-sdk.tgz"
          npm pack npm@11.9.0 --ignore-scripts --json --pack-destination "$RUNNER_TEMP/sdk-publish" > "$RUNNER_TEMP/npm-pack.json"
          mv "$RUNNER_TEMP/sdk-publish/npm-11.9.0.tgz" "$RUNNER_TEMP/sdk-publish/npm-cli.tgz"
          node --input-type=module -e '
          import fs from "node:fs"; import {createHash} from "node:crypto";
          const bytes=fs.readFileSync(process.env.RUNNER_TEMP+"/sdk-publish/npm-cli.tgz");
          if("sha512-"+createHash("sha512").update(bytes).digest("base64")!=="sha512-BBZoU926FCypj4b7V7ElinxsWcy4Kss88UG3ejFYmKyq7Uc5XnT34Me2nEhgCOaL5qY4HvGu5aI92C4OYd7NaA==")throw new Error("CLI integrity mismatch");
          '
          sdk_sha=$(sha256sum "$RUNNER_TEMP/sdk-publish/agentmargin-sdk.tgz")
          printf 'sdk_sha256=%s\n' "${sdk_sha%% *}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: approved-sdk-publish-input
          path: ${{ runner.temp }}/sdk-publish/
          retention-days: 7
          if-no-files-found: error

  npm:
    needs: build
    if: github.ref == 'refs/heads/main' && github.repository == 'rzkarsyad/agentmargin'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      # No repository checkout, dependency install or package lifecycle scripts.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: approved-sdk-publish-input
          path: ${{ runner.temp }}/sdk-publish
      - name: Verify publishing inputs
        env:
          SDK_SHA: ${{ needs.build.outputs.sdk_sha256 }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$SDK_SHA" =~ ^[a-f0-9]{64}$ ]]
          cd "$RUNNER_TEMP/sdk-publish"
          printf '%s  agentmargin-sdk.tgz\n' "$SDK_SHA" | sha256sum --check --status
          tar -xOzf agentmargin-sdk.tgz package/package.json > "$RUNNER_TEMP/publish-package.json"
          node --input-type=module -e '
          import fs from "node:fs";
          const p=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/publish-package.json"));
          if(p.name!=="@makinohq/agentmargin"||process.env.RELEASE_TAG!==`sdk-v${p.version}`||
             !/^sdk-v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$/.test(process.env.RELEASE_TAG)||
             p.private===true||p.publishConfig?.access!=="public"||Object.keys(p.publishConfig).some(k=>k!=="access"))
            throw new Error("Unexpected package identity or publish configuration");
          '
          node --input-type=module -e '
          import fs from "node:fs"; import {createHash} from "node:crypto";
          const bytes=fs.readFileSync("npm-cli.tgz");
          if("sha512-"+createHash("sha512").update(bytes).digest("base64")!=="sha512-BBZoU926FCypj4b7V7ElinxsWcy4Kss88UG3ejFYmKyq7Uc5XnT34Me2nEhgCOaL5qY4HvGu5aI92C4OYd7NaA==")throw new Error("CLI integrity mismatch");
          '
          mkdir "$RUNNER_TEMP/pinned-npm"
          tar -xzf npm-cli.tgz -C "$RUNNER_TEMP/pinned-npm" --strip-components=1
      - name: Publish approved prerelease with lifecycle scripts disabled
        run: node "$RUNNER_TEMP/pinned-npm/bin/npm-cli.js" publish "$RUNNER_TEMP/sdk-publish/agentmargin-sdk.tgz" --ignore-scripts --access public --provenance --tag alpha --registry=https://registry.npmjs.org
