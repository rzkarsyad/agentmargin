name: Next.js starter validation

on:
  push:
    branches: [feat/v0.4-developer-adoption]
  pull_request:
    paths:
      - 'examples/nextjs-starter/**'
      - 'packages/sdk/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/starter.yml'
      - 'scripts/sdk-registry-consumer-smoke.mjs'

permissions:
  contents: read

jobs:
  starter:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install monorepo dependencies
        run: npm ci
      - name: Verify publishable TypeScript SDK
        run: |
          npm run build:sdk
          npm run sdk:packcheck
      - name: Verify published npm consumer, signatures and provenance
        run: node scripts/sdk-registry-consumer-smoke.mjs --verify-signatures
      - name: Install starter dependencies and build
        run: |
          npm --prefix examples/nextjs-starter install --no-audit --no-fund
          npm --prefix examples/nextjs-starter run build
      - name: Audit Next.js starter dependencies (fail closed)
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm_config_fetch_retries=0 npm_config_fetch_timeout=20000 npm --prefix examples/nextjs-starter audit --audit-level=high; then
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::Next.js dependency audit did not pass"
              exit 1
            fi
            sleep $((attempt * 5))
          done
