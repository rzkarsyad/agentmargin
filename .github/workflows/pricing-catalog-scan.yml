name: Weekly provider pricing review candidates

on:
  schedule:
    - cron: '37 5 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/pricing-catalog-scan.yml'
      - 'scripts/pricing-catalog-scan.ts'
      - 'scripts/lib/pricing-catalog.ts'

# Read-only job: cannot modify rates, repository contents or workspaces.
permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Download bounded community catalog and generate candidate report
        run: |
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/pricing-catalog-scan.ts > pricing-candidates.json
          node --input-type=module -e '
            import fs from "node:fs";
            const r=JSON.parse(fs.readFileSync("pricing-candidates.json","utf8"));
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              "### Unapproved provider pricing candidates\n" +
              "- Source SHA-256: `"+r.sourceSha256+"`\n" +
              "- Models scanned: "+r.scanned+"\n" +
              "- Candidates: "+r.candidates.length+"\n" +
              "- Excluded or unsupported: "+r.skipped+"\n" +
              "- **No customer prices were updated. Verify official provider rates before applying.**\n");
          '
      - name: Upload candidate catalog (not approved pricing)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unapproved-provider-pricing-candidates
          path: pricing-candidates.json
          if-no-files-found: error
          retention-days: 14
