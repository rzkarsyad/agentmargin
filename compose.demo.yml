# Local synthetic-data demo only; PostgreSQL is bound to loopback.
name: agentmargin-local-demo
services:
  postgres:
    image: postgres:16@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
    environment:
      POSTGRES_DB: agentmargin_demo
      POSTGRES_USER: agentmargin_demo
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:${AGENTMARGIN_DEMO_DB_PORT:-55432}:5432"
    volumes:
      - postgres_demo_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U agentmargin_demo -d agentmargin_demo"]
      interval: 2s
      timeout: 2s
      retries: 20
volumes:
  postgres_demo_data:
